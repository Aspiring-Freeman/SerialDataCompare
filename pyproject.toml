[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SerialDataCompare"
version = "1.5.1"
description = "串口数据协议分析工具 - 用于解析和对比串口通信数据帧"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aspiring-Freeman"}
]
keywords = ["serial", "protocol", "parser", "data-analysis", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "PySide6>=6.4.0",
    "PySide6-Fluent-Widgets>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "black>=23.0",
    "isort>=5.0",
]

[project.urls]
Homepage = "https://github.com/Aspiring-Freeman/SerialDataCompare"
Repository = "https://github.com/Aspiring-Freeman/SerialDataCompare"
Issues = "https://github.com/Aspiring-Freeman/SerialDataCompare/issues"

[project.scripts]
serialdatacompare = "main_window:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "models*", "ui*", "utils*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
